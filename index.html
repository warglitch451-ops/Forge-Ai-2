/* =========================================================
   FORGEAI V2
   Architecture:

   USER PROMPT
       ↓
   GEMINI BLUEPRINT
       ↓
   VALIDATE BLUEPRINT
       ↓
   FORGEAI RENDERER
       ↓
   HTML
       ↓
   VALIDATE HTML
       ↓
   AUTO REPAIR
       ↓
   PREVIEW
========================================================= */

const CONFIG = {
  model: "gemini-3-flash-preview",
  apiBase:
    "https://generativelanguage.googleapis.com/v1beta/models/"
};

const state = {
  html: "",
  blueprint: null
};

const $ = id => document.getElementById(id);

function setStatus(text){
  $("status").textContent = text;
}

function escapeHTML(value){
  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

/* =========================================================
   GEMINI
========================================================= */

async function callGemini(prompt){

  const key = $("apiKey").value.trim();

  if(!key){
    throw new Error("Gemini API key is required.");
  }

  const url =
    CONFIG.apiBase +
    encodeURIComponent(CONFIG.model) +
    ":generateContent?key=" +
    encodeURIComponent(key);

  const response = await fetch(url,{
    method:"POST",
    headers:{
      "Content-Type":"application/json"
    },
    body:JSON.stringify({
      contents:[
        {
          role:"user",
          parts:[
            {text:prompt}
          ]
        }
      ],
      generationConfig:{
        temperature:.35,
        maxOutputTokens:18000,
        responseMimeType:"application/json"
      }
    })
  });

  if(!response.ok){
    const error = await response.text();
    throw new Error("Gemini API error: " + error);
  }

  const data = await response.json();

  const text =
    data?.candidates?.[0]?.content?.parts
      ?.map(x=>x.text || "")
      .join("") || "";

  if(!text){
    throw new Error("Gemini returned an empty response.");
  }

  return text;
}

/* =========================================================
   BLUEPRINT
========================================================= */

function blueprintPrompt(userPrompt,business){

return `
You are ForgeAI's website architect.

The user wants:

${userPrompt}

${business}

DO NOT generate HTML.

Return ONLY valid JSON matching this exact structure:

    "secondaryColor":"",

    "logo":"",

  },

/* =========================================================
   JSON CLEANER
========================================================= */

function parseJSON(text){

  let clean = String(text)
    .trim()
    .replace(/^```json/i,"")
    .replace(/^```/,"")
    .replace(/```$/,"")
    .trim();

  const start = clean.indexOf("{");
  const end = clean.lastIndexOf("}");

  if(start === -1 || end === -1){
    throw new Error("Gemini did not return valid JSON.");
  }

  clean = clean.slice(start,end + 1);

  try{
    return JSON.parse(clean);
  }catch(error){
    throw new Error("Blueprint JSON is invalid.");
  }
}

/* =========================================================
   BLUEPRINT VALIDATION
========================================================= */

function validateBlueprint(bp){

  if(!bp || typeof bp !== "object")
    return false;

  if(!bp.site?.name)
    return false;

  if(!bp.hero?.title)
    return false;

  if(!Array.isArray(bp.navbar?.links))
    return false;

  if(!Array.isArray(bp.sections))
    return false;

  return true;
}

/* =========================================================
   ICONS
========================================================= */

  bolt:"⚡",

  check:"✓",
  globe:"◎",
  spark:"✦",
  lock:"🔒",
  users:"◉"
};

function icon(value){
  return icons[String(value || "").toLowerCase()] || "✦";
}

   SECTION RENDERER
========================================================= */

    </div>
   `).join("")}

 </div>
</section>`;

  if(type === "pricing"){

 </div>
</section>`;

    <summary>${escapeHTML(x.title)}</summary>

 </div>
</section>`;
  }

  return `
<section class="section" id="${id}">
 <div class="container">
  <div class="section-head">
   <div class="kicker">DISCOVER</div>
   <h2>${escapeHTML(section.title)}</h2>

 </div>
</section>`;
}

      }

/* =========================================================
   HTML VALIDATOR
========================================================= */

function validateHTML(html){

  const errors=[];

  if(!html)
    errors.push("Empty HTML.");

  if((html.match(/<html/gi)||[]).length !== 1)
    errors.push("Multiple HTML documents detected.");

  if((html.match(/<head/gi)||[]).length !== 1)
    errors.push("Invalid head structure.");

  if((html.match(/<body/gi)||[]).length !== 1)
    errors.push("Invalid body structure.");

  if(!/<\/html>/i.test(html))
    errors.push("Missing closing html tag.");

  if(!/<meta[^>]+viewport/i.test(html))
    errors.push("Missing viewport meta.");

  if(!/<title>/i.test(html))
    errors.push("Missing title.");

  if(!/<style>/i.test(html))
    errors.push("Missing CSS.");

  return errors;
}

/* =========================================================
   AUTO REPAIR
========================================================= */

function repairHTML(html){

  let output = html.trim();

  output = output
    .replace(/^```html/i,"")
    .replace(/^```/,"")
    .replace(/```$/,"")
    .trim();

  const first = output.search(/<!doctype html>/i);

  if(first > 0){
    output = output.slice(first);
  }

  const secondDocument =
    output.search(/<!doctype html>/ig);

  if(secondDocument && secondDocument.length > 1){
    output = output.slice(
      secondDocument[0],
      secondDocument[1]
    );
  }

  return output;
}

/* =========================================================
   QUALITY SCORE
========================================================= */

function calculateScore(html,bp){

  let score=0;

  if(/<!doctype html>/i.test(html)) score+=10;
  if(/viewport/i.test(html)) score+=10;
  if(/<title>/i.test(html)) score+=10;
  if(/meta name="description"/i.test(html)) score+=10;
  if(/@media/i.test(html)) score+=10;
  if(/scroll-behavior/i.test(html)) score+=5;
  if(/IntersectionObserver/i.test(html)) score+=5;
  if(bp?.sections?.length) score+=15;
  if(bp?.navbar?.links?.length) score+=10;
  if(bp?.hero?.title) score+=15;

  return Math.min(score,100);
}

/* =========================================================
   GENERATE
========================================================= */

async function generate(){

  try{

    setStatus("Planning website with Gemini...");
    $("generate").disabled=true;

    const userPrompt =
      $("prompt").value.trim();

    if(!userPrompt){
      throw new Error("Describe the website first.");
    }

    const business =
      $("business").value;

    /* STEP 1 */

    const rawBlueprint =
      await callGemini(
        blueprintPrompt(
          userPrompt,
          business
        )
      );

    setStatus("Validating AI blueprint...");

    const blueprint =
      parseJSON(rawBlueprint);

    if(!validateBlueprint(blueprint)){
      throw new Error(
        "Gemini produced an incomplete blueprint."
      );
    }

    state.blueprint=blueprint;

    /* STEP 2 */

    setStatus("ForgeAI is building the website...");

    let html =
      renderWebsite(blueprint);

    /* STEP 3 */

    setStatus("Running quality checks...");

    let errors =
      validateHTML(html);

    /* STEP 4 */

    if(errors.length){

      setStatus(
        "Auto-repairing " +
        errors.length +
        " issue(s)..."
      );

      html=repairHTML(html);

      errors=validateHTML(html);
    }

    if(errors.length){
      throw new Error(
        "Website validation failed: " +
        errors.join(" ")
      );
    }

    /* STEP 5 */

    state.html=html;

    $("preview").srcdoc=html;

    const quality =
      calculateScore(html,blueprint);

    $("score").textContent =
      "Quality: " + quality + "/100";

    setStatus(
      "Website generated successfully."
    );

  }catch(error){

    console.error(error);

    setStatus(
      "Error: " + error.message
    );

  }finally{

    $("generate").disabled=false;

  }
}

/* =========================================================
   AI REDESIGN
========================================================= */

async function redesign(){

  if(!state.blueprint){

    setStatus(
      "Generate a website first."
    );

    return;
  }

  const instruction =
    prompt(
      "What do you want to change?"
    );

  if(!instruction) return;

  try{

    setStatus(
      "Planning redesign..."
    );

    const request=`

You are editing an existing website blueprint.

CURRENT BLUEPRINT:

${JSON.stringify(
  state.blueprint,
  null,
  2
)}

USER CHANGE:

${instruction}

Return ONLY the complete updated JSON blueprint.

Do not remove existing useful content unless necessary.

Do not generate HTML.
`;

    const result =
      await callGemini(request);

    const updated =
      parseJSON(result);

    if(!validateBlueprint(updated)){
      throw new Error(
        "Redesign returned an invalid blueprint."
      );
    }

    state.blueprint=updated;

    setStatus(
      "Rebuilding and validating..."
    );

    let html=
      renderWebsite(updated);

    html=
      repairHTML(html);

    const errors=
      validateHTML(html);

    if(errors.length){
      throw new Error(
        errors.join(" ")
      );
    }

    state.html=html;

    $("preview").srcdoc=html;

    $("score").textContent=
      "Quality: " +
      calculateScore(html,updated) +
      "/100";

    setStatus(
      "Redesign completed."
    );

  }catch(error){

    setStatus(
      "Redesign error: " +
      error.message
    );

  }

}

/* =========================================================
   DOWNLOAD
========================================================= */

function downloadHTML(){

  if(!state.html){

    setStatus(
      "Generate a website first."
    );

    return;
  }

  const blob =
    new Blob(
      [state.html],
      {type:"text/html"}
    );

  const url=
    URL.createObjectURL(blob);

  const a=
    document.createElement("a");

  a.href=url;
  a.download="forgeai-website.html";

  document.body.appendChild(a);

  a.click();

  a.remove();

  URL.revokeObjectURL(url);
}

/* =========================================================
   EVENTS
========================================================= */

$("generate")
  .addEventListener(
    "click",
    generate
  );

$("redesign")
  .addEventListener(
    "click",
    redesign
  );

$("download")
  .addEventListener(
    "click",
    downloadHTML
  );
