<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#090b10">
<title>ForgeAI Studio V4</title>

<style>
*{box-sizing:border-box}

:root{
  --bg:#080a0f;
  --panel:#10131b;
  --panel2:#171b25;
  --panel3:#1d2230;
  --line:#292f3d;
  --text:#f7f8fc;
  --muted:#98a1b5;
  --accent:#7c5cff;
  --accent2:#9a82ff;
  --good:#35d39a;
  --danger:#ff5570;
  --warning:#f6bd4f;
}

html,body{
  margin:0;
  padding:0;
  min-height:100%;
}

body{
  background:var(--bg);
  color:var(--text);
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
}

button,input,textarea,select{
  font:inherit;
}

button{
  cursor:pointer;
}

button:disabled{
  opacity:.5;
  cursor:not-allowed;
}

input,
textarea,
select{
  width:100%;
  background:var(--panel);
  border:1px solid var(--line);
  color:var(--text);
  border-radius:10px;
  padding:11px 12px;
  outline:none;
  transition:.2s;
}

input:focus,
textarea:focus,
select:focus{
  border-color:var(--accent);
  box-shadow:0 0 0 3px rgba(124,92,255,.12);
}

textarea{
  min-height:100px;
  resize:vertical;
}

.app{
  min-height:100vh;
  display:grid;
  grid-template-columns:300px 1fr;
}

.sidebar{
  background:#0c0f15;
  border-right:1px solid var(--line);
  padding:18px;
  overflow:auto;
  position:relative;
  z-index:10;
}

.brand{
  font-size:24px;
  font-weight:950;
  letter-spacing:-.04em;
}

.brand span{
  color:var(--accent);
}

.version{
  display:inline-block;
  margin-left:5px;
  padding:3px 6px;
  border:1px solid var(--line);
  border-radius:6px;
  font-size:9px;
  color:var(--muted);
  vertical-align:middle;
}

.small{
  font-size:11px;
  color:var(--muted);
  line-height:1.5;
}

.label{
  display:block;
  font-size:11px;
  color:var(--muted);
  margin:14px 0 6px;
  font-weight:700;
}

.btn{
  width:100%;
  border:0;
  border-radius:10px;
  padding:12px;
  margin-top:8px;
  background:var(--accent);
  color:#fff;
  font-weight:850;
  transition:.2s;
}

.btn:hover{
  transform:translateY(-1px);
  filter:brightness(1.08);
}

.btn.secondary{
  background:#202532;
}

.btn.success{
  background:#176d54;
}

.btn.danger{
  background:#6d2430;
}

.btn.warning{
  background:#6f541d;
}

.status{
  margin-top:12px;
  padding:11px;
  border:1px solid var(--line);
  border-radius:10px;
  background:#11141c;
  color:var(--muted);
  font-size:11px;
  line-height:1.5;
}

.status.good{
  border-color:rgba(53,211,154,.35);
  color:#83e8c2;
}

.status.error{
  border-color:rgba(255,85,112,.35);
  color:#ff9aaa;
}

.workspace{
  min-width:0;
  display:flex;
  flex-direction:column;
}

.topbar{
  height:64px;
  border-bottom:1px solid var(--line);
  display:flex;
  align-items:center;
  gap:9px;
  padding:10px 15px;
  background:#090b10;
}

.topbar .title{
  flex:1;
  font-weight:850;
}

.pill{
  font-size:10px;
  border:1px solid var(--line);
  background:var(--panel);
  padding:7px 10px;
  border-radius:999px;
  color:var(--muted);
}

.editor{
  display:grid;
  grid-template-columns:220px minmax(400px,1fr) 350px;
  min-height:calc(100vh - 64px);
}

.pages{
  border-right:1px solid var(--line);
  background:#0c0f15;
  padding:14px;
  overflow:auto;
}

.pagesTitle{
  font-size:11px;
  color:var(--muted);
  font-weight:900;
  letter-spacing:.1em;
  margin:4px 0 10px;
}

.pageBtn{
  width:100%;
  text-align:left;
  border:1px solid transparent;
  background:transparent;
  color:var(--muted);
  padding:12px;
  border-radius:10px;
  margin-bottom:6px;
}

.pageBtn:hover{
  background:#151923;
  color:#fff;
}

.pageBtn.active{
  background:#1a1e29;
  color:#fff;
  border-color:#343a49;
}

.pageBtn small{
  display:block;
  margin-top:3px;
  color:#697287;
}

.previewWrap{
  padding:14px;
  min-width:0;
  background:#080a0f;
}

.previewTools{
  display:flex;
  align-items:center;
  gap:7px;
  margin-bottom:9px;
  flex-wrap:wrap;
}

.previewTools button{

  margin:0;
  padding:8px 11px;
}

.previewSize{

  color:var(--muted);
}

.previewFrame{

  justify-content:center;
  width:100%;

iframe{

  border:1px solid var(--line);
  border-radius:14px;
  background:white;
  transition:.25s;
  box-shadow:0 25px 80px rgba(0,0,0,.3);
}

iframe.mobile{

  max-width:100%;
}

.inspector{

  padding:15px;

}

.inspectorHeader{

.groupTitle{

.row3{

.color{

.sectionEditor{

}

.sectionHeader{

}

.sectionHeader strong{

}

.iconBtn{

  color:#fff;

}

.iconBtn:hover{

.itemEditor{

.itemEditor input,

  line-height:1.5;

.qualityBox{

.qualityMetric{

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.72);
  backdrop-filter:blur(8px);
  z-index:100;
  display:none;
  align-items:center;
  justify-content:center;

  width:min(650px,100%);
  max-height:90vh;
  overflow:auto;
  background:#11141c;
  border:1px solid var(--line);
  border-radius:18px;
  padding:20px;
  box-shadow:0 30px 100px rgba(0,0,0,.55);
}

  justify-content:space-between;

}

.toast{

  right:20px;

  border-radius:10px;
  padding:12px 15px;

/* =====================================================
   HELPERS
===================================================== */

const $ =
  id =>
  document.getElementById(id);


function esc(value){

  return String(value ?? "")
    .replace(
      /[&<>"']/g,
      char =>
        ({
          "&":"&amp;",
          "<":"&lt;",
          ">":"&gt;",
          '"':"&quot;",
          "'":"&#039;"
        }[char])
    );

}


function uid(){

  return (
    Date.now().toString(36) +
    Math.random().toString(36).slice(2,8)
  );

}


function slug(value){

  return String(value || "")
    .toLowerCase()
    .trim()
    .replace(/[^a-z0-9]+/g,"-")
    .replace(/^-+|-+$/g,"")
    .slice(0,40) || "page";

}


function toast(message){

  const el =
    $("toast");

  el.textContent =
    message;

  el.classList.add("show");

  clearTimeout(
    toast.timer
  );

  toast.timer =
    setTimeout(

}

/* =====================================================
   DEFAULT CONTENT
===================================================== */

function defaultItem(type){

  const names = {

    products:"Product",

    gallery:"Gallery Image",

    faq:"Frequently Asked Question",

function defaultSection(type){

  const section = {

    id:uid(),

    type:type,

    title:
      type === "products"
      ? "Featured Collection"
      : type === "features"
      ? "Why Choose Us"
      : type === "faq"
      ? "Frequently Asked Questions"
      : type === "gallery"
      ? "Our Collection"
      : type === "stats"
      ? "Built for Results"
      : type === "contact"
      ? "Get in Touch"
      : type === "cta"
      ? "Ready to Get Started?"
      : "About",

    description:
      "Discover what makes this business different.",

    items:[]

  };


  let count = 3;

  if(type === "products")
    count = 6;

  if(type === "faq")
    count = 4;

  if(type === "stats")
    count = 4;

  for(
    let i=0;
    i<count;
    i++
  ){

    section.items.push(
      defaultItem(type)
    );

  }


  return section;

}


/* =====================================================
   GEMINI CALL
===================================================== */

async function gemini(
  prompt
){

  const key =
    $("apiKey")
      .value
      .trim();


  if(!key){

    throw new Error(
      "Enter your Gemini API key for testing."
    );

  }


  const url =
    CONFIG.endpoint +
    encodeURIComponent(
      CONFIG.model
    ) +
    ":generateContent?key=" +
    encodeURIComponent(key);


  const response =
    await fetch(
      url,
      {

        method:"POST",

        headers:{
          "Content-Type":
            "application/json"
        },

        body:
          JSON.stringify({

            contents:[
              {
                role:"user",

                parts:[
                  {
                    text:prompt
                  }
                ]
              }
            ],

            generationConfig:{

              temperature:.35,

              maxOutputTokens:30000,

              responseMimeType:
                "application/json"

            }

          })

      }
    );


  if(!response.ok){

    const text =
      await response.text();

    throw new Error(
      "Gemini API error: " +
      text.slice(0,500)
    );

  }


  const data =
    await response.json();


  const parts =
    data
      ?.candidates?.[0]
      ?.content?.parts || [];


  const text =
    parts
      .map(
        part =>
          part.text || ""
      )
      .join("");


  if(!text){

    throw new Error(
      "Gemini returned empty content."
    );

  }


  return text;

}


/* =====================================================
   ROBUST JSON PARSER
===================================================== */

function parseJSON(
  raw
){

  let text =
    String(raw || "")
      .trim();


  text =
    text
      .replace(
        /^```json\s*/i,
        ""
      )
      .replace(
        /^```\s*/i,
        ""
      )
      .replace(
        /\s*```$/i,
        ""
      )
      .trim();


  /*
   First try normal JSON.
  */

  try{

    return JSON.parse(
      text
    );

  }

  catch(_){}


  /*
   Find first { and last }.
  */

  const start =
    text.indexOf("{");

  const end =
    text.lastIndexOf("}");


  if(
    start === -1 ||
    end === -1
  ){

    throw new Error(
      "AI returned invalid JSON."
    );

  }


  try{

    return JSON.parse(
      text.slice(
        start,
        end + 1
      )
    );

  }

  catch(error){

    throw new Error(
      "AI JSON could not be parsed: " +
      error.message
    );

  }

}

/* =====================================================
   NORMALIZE BLUEPRINT
===================================================== */

function normalizeBlueprint(
  bp
){

  if(!bp || typeof bp !== "object"){

    throw new Error(
      "AI returned no project."
    );

  }


  if(
    !bp.brand ||
    !Array.isArray(bp.pages)
  ){

    throw new Error(
      "AI returned an incomplete project."
    );

  }


  const required =
    ["home","products","about"];


  for(
    const id of required
  ){

    if(
      !bp.pages.some(
        page =>
          page.id === id
      )
    ){

      throw new Error(
        "AI did not create the required " +
        id +
        " page."
      );

    }

  }


  bp.brand =
    Object.assign(
      {
        name:"ForgeAI Website",
        tagline:"Built for modern businesses",
        description:"",
        logoText:"",
        primary:"#7c5cff",
        secondary:"#10131b",
        accent:"#ffffff"
      },
      bp.brand
    );


  bp.seo =
    Object.assign(
      {
        title:
          bp.brand.name,
        description:
          bp.brand.description,
        keywords:[]
      },
      bp.seo || {}
    );


  bp.footer =
    Object.assign(
      {
        description:
          bp.brand.description,
        email:"",
        phone:"",
        address:""
      },
      bp.footer || {}
    );


  /*
   Keep ONLY required 3 pages.
  */

  bp.pages =
    required.map(
      id =>
        bp.pages.find(
          page =>
            page.id === id
        )
    );


  bp.pages.forEach(
    page => {

      page.name =
        page.name ||
        (
          page.id === "home"
          ? "Home"
          : page.id === "products"
          ? "Products"
          : "About"
        );


      page.hero =
        Object.assign(
          {
            eyebrow:
              bp.brand.tagline,
            title:
              page.name,
            description:
              bp.brand.description,
            button:
              page.id === "products"
              ? "Explore"
              : "Learn More",
            buttonLink:
              page.id === "products"
              ? "#products"
              : "#about",
            image:""
          },
          page.hero || {}
        );


      page.sections =
        Array.isArray(
          page.sections
        )
        ? page.sections
        : [];


      page.sections =
        page.sections
          .filter(Boolean)
          .map(
            section => {

              section.id =
                section.id ||
                uid();

              section.type =
                section.type ||
                "features";

              section.title =
                section.title ||
                "Section";

              section.description =
                section.description ||
                "";

              section.items =
                Array.isArray(
                  section.items
                )
                ? section.items
                : [];

              section.items =
                section.items.map(
                  item =>
                    Object.assign(
                      {
                        title:"Item",
                        description:"",
                        image:"",
                        price:"",
                        button:"Learn More"
                      },
                      item || {}
                    )
                );

              return section;

            }
          );

    }
  );


  /*
   Guarantee minimum content.
  */

  const home =
    bp.pages.find(
      p => p.id === "home"
    );

  const products =
    bp.pages.find(
      p => p.id === "products"
    );

  const about =
    bp.pages.find(
      p => p.id === "about"
    );


  if(home.sections.length < 3){

    home.sections.push(
      defaultSection("features"),
      defaultSection("cta")
    );

  }


  if(products.sections.length < 2){

    products.sections.push(
      defaultSection("products"),
      defaultSection("cta")
    );

  }


  if(
    productItems(products).length < 6
  ){

    let section =
      products.sections.find(
        s =>
          s.type === "products"
      );


    if(!section){

      section =
        defaultSection("products");

      products.sections.unshift(
        section
      );

    }


    while(
      section.items.length < 6
    ){

      section.items.push(
        defaultItem("products")
      );

    }

  }


  if(about.sections.length < 3){

    about.sections.push(
      defaultSection("about"),
      defaultSection("faq"),
      defaultSection("cta")
    );

  }


  return bp;

}


/* =====================================================
   PRODUCT / SERVICE HELPERS
===================================================== */

function productSections(
  page
){

  return (
    page?.sections || []
  )
    .filter(
      section =>
        section.type === "products" ||
        section.type === "services"
    );

}


function productItems(
  page
){

  return productSections(page)
    .flatMap(
      section =>
        Array.isArray(
          section.items
        )
        ? section.items
        : []
    );

}

/* =====================================================
   IMAGE COMPRESSION
===================================================== */

function readImage(
  file
){

  return new Promise(
    (resolve,reject) => {

      if(!file){

        reject(
          new Error(
            "No image selected."
          )
        );

        return;

      }


      const reader =
        new FileReader();


      reader.onload =
        event => {

          const img =
            new Image();


          img.onload =
            () => {

              const max =
                1400;


              let width =
                img.width;

              let height =
                img.height;


              if(
                width > max ||
                height > max
              ){

                const scale =
                  Math.min(
                    max / width,
                    max / height
                  );

                width =
                  Math.round(
                    width * scale
                  );

                height =
                  Math.round(
                    height * scale
                  );

              }


              const canvas =
                document.createElement(
                  "canvas"
                );


              canvas.width =
                width;

              canvas.height =
                height;


              const ctx =
                canvas.getContext(
                  "2d"
                );


              ctx.drawImage(
                img,
                0,
                0,
                width,
                height
              );


              resolve(
                canvas.toDataURL(
                  "image/jpeg",
                  .78
                )
              );

            };


          img.onerror =
            () =>
              reject(
                new Error(
                  "Could not read image."
                )
              );


          img.src =
            event.target.result;

        };


      reader.onerror =
        () =>
          reject(
            new Error(
              "Could not load image."
            )
          );


      reader.readAsDataURL(file);

    }
  );

}

/* =====================================================

===================================================== */

function renderSectionEditors(){

  const page =
    selectedPage();


  const container =
    $("sectionEditors");


  container.innerHTML =
    page.sections
      .map(
        (section,index) => `

        <div
          class="sectionEditor"
          data-section="${esc(
            section.id
          )}"
        >

          <div class="sectionHeader">

            <strong>
              ${esc(
                section.type
              )}
            </strong>

            <button
              class="iconBtn"
              data-move-up="${index}"
              title="Move up"
            >
              ↑
            </button>

            <button
              class="iconBtn"
              data-move-down="${index}"
              title="Move down"
            >
              ↓
            </button>

            <button
              class="iconBtn"
              data-delete-section="${index}"
              title="Delete"
            >
              ×
            </button>

          </div>


          <label class="label">
            Section title
          </label>

          <input
            data-section-index="${index}"
            data-section-field="title"
            value="${esc(
              section.title
            )}"
          >


          <label class="label">
            Description
          </label>

          <textarea
            data-section-index="${index}"
            data-section-field="description"
          >${esc(
            section.description
          )}</textarea>


          ${
            section.type === "products" ||
            section.type === "services" ||
            section.type === "features" ||
            section.type === "about" ||
            section.type === "gallery" ||
            section.type === "faq" ||
            section.type === "stats" ||
            section.type === "contact"

            ?

            `

            <div class="small">
              ${section.items.length}
              items
            </div>

            `

            :

            ""
          }

        </div>

        `
      )
      .join("");


  /*
   Section field editing
  */

  container
    .querySelectorAll(
      "[data-section-index][data-section-field]"
    )
    .forEach(
      input => {

        input.addEventListener(
          "input",
          () => {

            const index =
              Number(
                input.dataset.sectionIndex
              );

            const field =
              input.dataset.sectionField;


            page.sections[index][field] =
              input.value;


            markDirty();

            updatePreviewOnly();

          }
        );

      }
    );


  /*
   Move up
  */

  container
    .querySelectorAll(
      "[data-move-up]"
    )
    .forEach(
      button => {

        button.onclick =
          () => {

            const index =
              Number(
                button.dataset.moveUp
              );


            if(index <= 0)
              return;


            [
              page.sections[index - 1],
              page.sections[index]
            ] =
            [
              page.sections[index],
              page.sections[index - 1]
            ];


            markDirty();

            renderAll();

          };

      }
    );


  /*
   Move down
  */

  container
    .querySelectorAll(
      "[data-move-down]"
    )
    .forEach(
      button => {

        button.onclick =
          () => {

            const index =
              Number(
                button.dataset.moveDown
              );


            if(
              index >=
              page.sections.length - 1
            )
              return;


            [
              page.sections[index],
              page.sections[index + 1]
            ] =
            [
              page.sections[index + 1],
              page.sections[index]
            ];


            markDirty();

            renderAll();

          };

      }
    );


  /*
   Delete
  */

  container
    .querySelectorAll(
      "[data-delete-section]"
    )
    .forEach(
      button => {

        button.onclick =
          () => {

            const index =
              Number(
                button.dataset.deleteSection
              );


            if(
              !confirm(
                "Delete this section?"
              )
            )
              return;


            page.sections.splice(
              index,
              1
            );


            markDirty();

            renderAll();

          };

      }
    );

}

          buttonLink:
            "#home",

          image:""

          defaultSection(

/* =====================================================
   QUALITY ENGINE
===================================================== */

function runQualityCheck(
  project
){

  const checks = [];


  if(!project){

    return {
      score:0,
      checks:[]
    };

  }


  /*
   Pages
  */

  checks.push({

    name:"Page structure",

    pass:
      Array.isArray(
        project.pages
      ) &&
      project.pages.length >= 3

  });


  /*
   Brand
  */

  checks.push({

    name:"Brand identity",

    pass:
      Boolean(
        project.brand?.name
      ) &&
      Boolean(
        project.brand?.primary
      )

  });


  /*
   Hero
  */

  checks.push({

    name:"Hero content",

    pass:
      project.pages.every(
        page =>
          Boolean(
            page.hero?.title
          ) &&
          Boolean(
            page.hero?.description
          )

      )

  });


  /*
   Sections
  */

  checks.push({

    name:"Content sections",

    pass:
      project.pages.every(
        page =>
          Array.isArray(
            page.sections
          ) &&
          page.sections.length >= 2
      )

  });


  /*
   Products/services
  */

  const products =
    productItems(
      project.pages.find(
        page =>
          page.id === "products"
      )
    );


  checks.push({

    name:"Catalog",

    pass:
      products.length >= 6

  });


  /*
   Product names
  */

  checks.push({

    name:"Catalog data",

    pass:
      products.length === 0 ||
      products.every(
        item =>
          Boolean(
            item.title
          ) &&
          Boolean(
            item.description
          )
      )

  });


  /*
   SEO
  */

  checks.push({

    name:"SEO",

    pass:
      Boolean(
        project.seo?.title
      ) &&
      Boolean(
        project.seo?.description
      )

  });


  /*
   Footer
  */

  checks.push({

    name:"Footer",

    pass:
      Boolean(
        project.footer
      )

  });


  /*
   Navigation IDs
  */

  checks.push({

    name:"Navigation",

    pass:
      project.pages.every(
        page =>
          Boolean(page.id) &&
          Boolean(page.name)
      )

  });


  /*
   Images
  */

  const allImages =
    project.pages.flatMap(
      page => [

        page.hero?.image,

        ...page.sections.flatMap(
          section =>
            section.items.map(
              item =>
                item.image
            )
        )

      ]
    )
    .filter(Boolean);


  checks.push({

    name:"Visual content",

    pass:
      allImages.length >= 3

  });


  /*
   Score
  */

  const passed =
    checks.filter(
      check =>
        check.pass
    ).length;


  const score =
    Math.round(
      (
        passed /
        checks.length
      ) *
      100
    );


  return {
    score,
    checks
  };

}


/* =====================================================
   QUALITY DETAILS
===================================================== */

function renderQualityDetails(
  result
){

  if(!result)
    return;


  const target =
    $("qualityDetails");


  if(!target)
    return;


  target.innerHTML = `

<div class="qualityBox">

<div class="qualityMetric">

<b>
${result.score}/100
</b>

<span>
Website quality
</span>

</div>


<div class="qualityMetric">

<b>
${
  result.checks.filter(
    x => x.pass
  ).length
}/
${result.checks.length}
</b>

<span>
Checks passed
</span>

</div>

</div>


<div class="notice">

${
  result.checks.map(
    check =>
      (
        check.pass
        ? "✓ "
        : "✕ "
      ) +
      check.name
  ).join("<br>")
}

</div>

`;

}

===================================================== */

function markDirty(){

    true;

}


/* =====================================================
   GENERATE
===================================================== */

async function generate(){

  try{

    $("generateBtn")
      .disabled =
      true;


    status(
      "AI is designing your website..."
    );


    const raw =
      await gemini(
        blueprintPrompt()
      );


    status(
      "AI blueprint received. Validating..."
    );


    const blueprint =
      normalizeBlueprint(
        parseJSON(raw)
      );


    state.project =
      blueprint;


    state.selectedPage =
      "home";


    state.dirty =
      true;


    status(
      "Building visual editor and preview..."
    );


    renderAll();


    const quality =
      runQualityCheck(
        state.project
      );


    state.lastQuality =
      quality;


    status(
      "Website generated successfully. Quality: " +
      quality.score +
      "/100",
      quality.score >= 80
      ? "good"
      : ""
    );


    toast(
      "ForgeAI website generated."
    );

  }

  catch(error){

    console.error(error);

    status(
      "Generation error: " +
      error.message,
      "error"
    );

  }

  finally{

    $("generateBtn")
      .disabled =
      false;

  }

}


/* =====================================================
   AI IMPROVE
===================================================== */

async function improve(){

  if(!state.project){

    toast(
      "Generate a project first."
    );

    return;

  }


  try{

    $("improveBtn")
      .disabled =
      true;


    status(
      "AI is analyzing your existing website..."
    );


    /*
     IMPORTANT:

     AI is instructed to improve content
     while preserving IDs and editable values.

     It does NOT receive permission to
     randomly rebuild the whole project.
    */

    const current =
      JSON.stringify(
        state.project,
        null,
        2
      );


    const prompt = `

You are ForgeAI's senior conversion designer.

Here is the CURRENT WEBSITE BLUEPRINT:

${current}


Improve the website professionally.

IMPORTANT:

- Preserve all page IDs.
- Preserve all existing product names unless they are clearly poor.
- Preserve manually entered prices.
- Preserve manually uploaded image data.
- Preserve existing images.
- Preserve brand colors.
- Preserve user-entered contact details.
- Do not delete sections.
- Do not reduce the number of products.
- Do not invent awards.
- Do not invent certifications.
- Do not invent revenue.
- Do not invent customer counts.
- Do not invent fake reviews.
- Improve copy, section titles and descriptions.
- Improve conversion quality.
- Improve clarity.
- Improve professionalism.
- Keep exactly the same JSON schema.
- Return complete JSON only.

`;


    const improved =
      normalizeBlueprint(
        parseJSON(
          await gemini(
            prompt
          )
        )
      );


    /*
     Preserve user-owned values
     from current project.
    */

    improved.brand.primary =
      state.project.brand.primary;

    improved.brand.accent =
      state.project.brand.accent;

    improved.brand.secondary =
      state.project.brand.secondary;


    improved.pages.forEach(
      newPage => {

        const oldPage =
          state.project.pages.find(
            page =>
              page.id ===
              newPage.id
          );


        if(!oldPage)
          return;


        /*
         Preserve images.
        */

        if(
          oldPage.hero?.image
        ){

          newPage.hero.image =
            oldPage.hero.image;

        }


        /*
         Preserve product images,
         prices and names.
        */

        const oldItems =
          productItems(
            oldPage
          );

        const newItems =
          productItems(
            newPage
          );


        newItems.forEach(
          (item,index) => {

            const old =
              oldItems[index];


            if(!old)
              return;


            if(old.image)
              item.image =
                old.image;


            if(old.price)
              item.price =
                old.price;


            if(old.title)
              item.title =
                old.title;

          }
        );

      }
    );


    state.project =
      improved;


    markDirty();

    renderAll();


    status(
      "AI improvement completed without removing your important edits.",
      "good"
    );


    toast(
      "AI improvement complete."
    );

  }

  catch(error){

    console.error(error);

    status(
      "AI Improve error: " +
      error.message,
      "error"
    );

  }

  finally{

    $("improveBtn")
      .disabled =
      false;

  }

}

/* =====================================================
   DOWNLOAD
===================================================== */

function download(){

  if(!state.project){

    toast(
      "Generate a website first."
    );

    return;

  }


  const html =
    renderSite(
      state.project
    );


  const blob =
    new Blob(
      [html],
      {
        type:
          "text/html;charset=utf-8"
      }
    );


  const url =
    URL.createObjectURL(
      blob
    );


  const a =
    document.createElement(
      "a"
    );


  a.href =
    url;


  a.download =
    (
      state.project.brand.name ||
      "forgeai-website"
    )
      .replace(
        /[^a-z0-9]+/gi,
        "-"
      )
      .replace(
        /^-+|-+$/g,
        ""
      )
      .toLowerCase() +
    ".html";


  document.body.appendChild(a);

  a.click();

  a.remove();


  setTimeout(
    () =>
      URL.revokeObjectURL(url),
    1000
  );


  toast(
    "HTML downloaded."
  );

}


/* =====================================================
   SAVE
===================================================== */

function save(){

  if(!state.project){

    toast(
      "Nothing to save."
    );

    return;

  }


  try{

    localStorage.setItem(
      "forgeai-v4-project",
      JSON.stringify(
        state.project
      )
    );


    state.dirty =
      false;


    status(
      "Project saved on this device.",
      "good"
    );


    toast(
      "Project saved."
    );

  }

  catch(error){

    status(
      "Could not save project. Your images may be too large.",
      "error"
    );

  }

}


/* =====================================================
   LOAD
===================================================== */

function load(){

  try{

    const raw =
      localStorage.getItem(
        "forgeai-v4-project"
      );


    if(!raw)
      return;


    state.project =
      normalizeBlueprint(
        JSON.parse(raw)
      );


    state.selectedPage =
      "home";


    renderAll();


    status(
      "Saved project loaded.",
      "good"
    );

  }

  catch(error){

    console.warn(error);

    localStorage.removeItem(
      "forgeai-v4-project"
    );

  }

}
