"use strict";


/*
 ForgeAI Studio V3

 IMPORTANT:

 For production, move the Gemini call
 to your own backend.

 Never ship a production Gemini API key
 in browser JavaScript.
*/


const CONFIG = {

  model:
    "gemini-3-flash-preview",

  endpoint:
    "https://generativelanguage.googleapis.com/v1beta/models/"

};


const state = {

};


const $ =
  id =>

const esc =
  s =>
  String(s ?? "")
  .replace(
    /[&<>"']/g,
    m =>
      ({
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#039;"
      }[m])
  );


function status(s){

  $("status").textContent = s;

}


function uid(){

  return Math.random()
    .toString(36)
    .slice(2,10);

}


/* =====================================================
   GEMINI
===================================================== */

async function gemini(prompt){

  const key =
    $("apiKey")
    .value
    .trim();

  if(!key){

    throw new Error(
      "Enter your Gemini API key for this test."
    );

  }


  const url =
    CONFIG.endpoint +
    encodeURIComponent(CONFIG.model) +
    ":generateContent?key=" +
    encodeURIComponent(key);


  const r =
    await fetch(
      url,
      {
        method:"POST",

        headers:{
          "Content-Type":
            "application/json"
        },

        body:
          JSON.stringify({

            contents:[
              {
                role:"user",

                parts:[
                  {
                    text:prompt
                  }
                ]
              }
            ],

            generationConfig:{

              temperature:.25,

              maxOutputTokens:24000,

              responseMimeType:
                "application/json"

            }

          })

      }
    );


  if(!r.ok){

    throw new Error(
      "Gemini API error: " +
      await r.text()
    );

  }


  const data =
    await r.json();


  const text =
    (
      data
      ?.candidates?.[0]
      ?.content?.parts || []
    )
    .map(
      x => x.text || ""
    )
    .join("");


  if(!text){

    throw new Error(
      "Gemini returned no content."
    );

  }


  return text;

}


/* =====================================================
   JSON PARSER
===================================================== */

function parseJSON(raw){

  let s =
    String(raw)
      .trim()
      .replace(
        /^```json/i,
        ""
      )
      .replace(
        /^```/,
        ""
      )
      .replace(
        /```$/,
        ""
      )
      .trim();


  const a =
    s.indexOf("{");


  const b =
    s.lastIndexOf("}");


  if(
    a < 0 ||
    b < 0
  ){

    throw new Error(
      "AI returned invalid JSON."
    );

  }


  return JSON.parse(
    s.slice(
      a,
      b + 1
    )
  );

}

/* =====================================================
   BLUEPRINT VALIDATION
===================================================== */

function ensureBlueprint(bp){

  if(
    !bp ||
    !bp.brand ||
    !Array.isArray(bp.pages) ||
    bp.pages.length !== 3
  ){

    throw new Error(
      "AI returned an incomplete 3-page blueprint."
    );

  }


  const ids =
    bp.pages.map(
      p => p.id
    );


  if(
    !ids.includes("home") ||
    !ids.includes("products") ||
    !ids.includes("about")
  ){

    throw new Error(
      "Required pages are missing."
    );

  }


  bp.pages.forEach(
    p => {

      p.sections =
        Array.isArray(p.sections)
        ? p.sections
        : [];

      p.hero =
        p.hero || {};

    }
  );


  return bp;

}


/* =====================================================
   PRODUCTS
===================================================== */

function productItems(page){

  return page.sections.flatMap(
    s =>
      s.type === "products" &&
      Array.isArray(s.items)
      ? s.items
      : []
  );

}


/* =====================================================
   PAGE RENDERER
===================================================== */

function renderPage(
  page,
  bp
){

  const hero =
    page.hero || {};


  const sections =
    (page.sections || [])
      .map(
        (s,i) =>
          renderSection(
            s,
            i,
            bp
          )
      )
      .join("");


  return `

  <section
    class="page"
    data-page="${esc(page.id)}"
  >

    <header class="hero">

      <div class="heroCopy">

        <div class="eyebrow">
          ${esc(
            hero.eyebrow ||
            bp.brand.tagline ||
            "WELCOME"
          )}
        </div>

        <h1>
          ${esc(
            hero.title ||
            page.name
          )}
        </h1>

        <p>
          ${esc(
            hero.description ||
            bp.brand.description ||
            ""
          )}
        </p>

        <a
          class="ctaBtn"
          href="#products"
        >
          ${esc(
            hero.button ||
            "Explore"
          )}
        </a>

      </div>


      ${
        hero.image

        ?

        `
        <img
          class="heroImg"
          src="${esc(hero.image)}"
          alt="${esc(
            hero.title ||
            page.name
          )}"
        >
        `

        :

        `
        <div class="heroVisual">

          <span>
            ${esc(
              bp.brand.logoText ||
              bp.brand.name
            )}
          </span>

        </div>
        `
      }

    </header>


    ${sections}

  </section>

  `;

}


/* =====================================================
   SECTION RENDERER
===================================================== */

function renderSection(
  s,
  index,
  bp
){

  const id =
    (s.type || "section") +
    "-" +
    index;


  const items =
    Array.isArray(s.items)
    ? s.items
    : [];


  if(
    s.type === "products"
  ){

    return `

    <section
      class="section"
      id="${id}"
    >

      <div class="wrap">

        <div class="sectionHead">

          <span>
            COLLECTION
          </span>

          <h2>
            ${esc(s.title)}
          </h2>

          <p>
            ${esc(s.description)}
          </p>

        </div>


        <div class="productGrid">

          ${items.map(
            (p,i) => `

            <article class="product">

              <img
                src="${esc(
                  p.image ||
                  "https://images.unsplash.com/photo-1556742049-0cfed4f6a45d?auto=format&fit=crop&w=900&q=80"
                )}"
                alt="${esc(
                  p.title
                )}"
              >


              <div class="productBody">

                <h3>
                  ${esc(p.title)}
                </h3>

                <p>
                  ${esc(p.description)}
                </p>


                <div class="productBottom">

                  <strong>
                    ${esc(
                      p.price ||
                      "Contact for price"
                    )}
                  </strong>


                  <button
                    onclick="
                      window.parent.postMessage(
                        {
                          type:'product',
                          index:${i}
                        },
                        '*'
                      )
                    "
                  >
                    ${esc(
                      p.button ||
                      "View product"
                    )}
                  </button>

                </div>

              </div>

            </article>

          `
          ).join("")}

        </div>

      </div>

    </section>

    `;

  }


  if(
    s.type === "features" ||
    s.type === "about" ||
    s.type === "contact" ||
    s.type === "faq" ||
    s.type === "cta" ||
    s.type === "stats" ||
    s.type === "gallery"
  ){

    return `

    <section
      class="section"
      id="${id}"
    >

      <div class="wrap">

        <div class="sectionHead">

          <span>
            ${esc(
              s.type.toUpperCase()
            )}
          </span>

          <h2>
            ${esc(s.title)}
          </h2>

          <p>
            ${esc(s.description)}
          </p>

        </div>


        <div class="cards">

          ${items.map(
            x => `

            <article class="card">

              ${
                x.image
                ?
                `
                <img
                  src="${esc(x.image)}"
                  alt="${esc(x.title)}"
                >
                `
                :
                ""
              }


              <h3>
                ${esc(x.title)}
              </h3>

              <p>
                ${esc(x.description)}
              </p>


              ${
                x.price
                ?
                `
                <strong>
                  ${esc(x.price)}
                </strong>
                `
                :
                ""
              }

            </article>

          `
          ).join("")}

        </div>

      </div>

    </section>

    `;

  }


  return "";

}

</style>

</head>


<body>


<nav class="nav">

  <div class="navIn">

    <a
      class="logo"
      href="#home"
    >

      <b>
        ${esc(
          bp.brand.logoText ||
          bp.brand.name
        )}
      </b>

    </a>


    <div class="navLinks">

      ${bp.pages.map(
        p => `

        <a
          data-nav="${esc(p.id)}"
          href="#${esc(p.id)}"
        >

          ${esc(p.name)}

        </a>

        `
      ).join("")}

    </div>

  </div>

</nav>


<main>

  ${bp.pages
    .map(
      p =>
        renderPage(
          p,
          bp
        )
    )
    .join("")
  }

</main>


<footer>

  <div class="wrap">

    <div>

      <strong>
        ${esc(
          bp.brand.name
        )}
      </strong>

      <p>
        ${esc(
          bp.footer?.description ||
          bp.brand.description
        )}
      </p>

    </div>


    <div>

      ${esc(
        bp.footer?.email ||
        ""
      )}

    </div>

  </div>

</footer>


<script>

function showPage(id){

  document
    .querySelectorAll(".page")
    .forEach(
      x =>
        x.classList.toggle(
          "active",
          x.dataset.page === id
        )
    );


  document
    .querySelectorAll("[data-nav]")
    .forEach(
      x =>
        x.classList.toggle(
          "active",
          x.dataset.nav === id
        )
    );

}


function route(){

  const id =
    (
      location.hash ||
      "#home"
    ).slice(1);


  showPage(

    document.querySelector(
      '.page[data-page="' +
      id +
      '"]'
    )
      ? id
      : "home"

  );

}


window.addEventListener(
  "hashchange",
  route
);


route();

<\/script>


</body>

</html>

`;

}


/* =====================================================
   PAGE SIDEBAR
===================================================== */

function renderPagesUI(){

  const pages =
    $("pages");


  if(!state.project){

    pages.innerHTML="";

    return;

  }


  pages.innerHTML =
    state.project.pages
      .map(
        p => `

        <button
          class="pageBtn
          ${
            p.id ===
            state.selectedPage
            ? "active"
            : ""
          }"

          data-page="${esc(p.id)}"
        >

          ${esc(p.name)}

        </button>

        `
      )
      .join("");


  pages
    .querySelectorAll(
      ".pageBtn"
    )
    .forEach(
      b => {

        b.onclick=()=>{

          state.selectedPage =
            b.dataset.page;

          state.selectedProduct=0;

          renderAll();

        };

      }
    );

}


/* =====================================================
   SELECTED PAGE
===================================================== */

function selected(){

  return state.project.pages.find(
    p =>
      p.id ===
      state.selectedPage
  );

}


/* =====================================================
   EDITOR / INSPECTOR
===================================================== */

function renderInspector(){

  const p =
    selected();


  if(!p){

    $("inspectorContent")
      .innerHTML =
      "Generate a project first.";

    return;

  }


  const products =
    productItems(p);


  $("inspectorContent")
    .innerHTML = `


    <div class="group">

      <label class="label">
        Page name
      </label>

      <input
        id="editPageName"
        value="${esc(p.name)}"
      >


      <label class="label">
        Hero title
      </label>

      <textarea
        id="editHeroTitle"
      >${esc(
        p.hero?.title || ""
      )}</textarea>


      <label class="label">
        Hero description
      </label>

      <textarea
        id="editHeroDesc"
      >${esc(
        p.hero?.description || ""
      )}</textarea>


      <label class="label">
        Hero image URL
      </label>

      <input
        id="editHeroImage"
        value="${esc(
          p.hero?.image || ""
        )}"
      >


      <label class="label">
        Upload hero photo
      </label>

      <input
        id="heroFile"
        type="file"
        accept="image/*"
      >


      <button
        class="btn"
        id="applyHero"
      >
        Apply Page Edits
      </button>

    </div>


    ${
      products.length

      ?

      `

      <div class="group">

        <h3>
          Products
        </h3>


        ${products
          .map(
            (x,i) => `

            <div class="productRow">

              <b>
                Product ${i+1}
              </b>


              <input
                data-p="${i}"
                data-k="title"
                value="${esc(
                  x.title || ""
                )}"
                placeholder="Product name"
              >


              <input
                data-p="${i}"
                data-k="price"
                value="${esc(
                  x.price || ""
                )}"
                placeholder="Price"
              >


              <input
                data-p="${i}"
                data-k="image"
                value="${esc(
                  x.image || ""
                )}"
                placeholder="Image URL"
              >


              <input
                data-p="${i}"
                data-k="description"
                value="${esc(
                  x.description || ""
                )}"
                placeholder="Description"
              >


              <input
                type="file"
                data-file="${i}"
                accept="image/*"
              >

            </div>

            `
          )
          .join("")
        }


        <button
          class="btn"
          id="applyProducts"
        >
          Apply Product Edits
        </button>

      </div>

      `

      :

      ""

    }


    <div class="group">

      <h3>
        Brand
      </h3>


      <label class="label">
        Brand name
      </label>

      <input
        id="brandName"
        value="${esc(
          state.project.brand.name
        )}"
      >


      <label class="label">
        Primary color
      </label>

      <input
        id="brandColor"
        class="color"
        type="color"
        value="${esc(
          state.project.brand.primary ||
          "#7c5cff"
        )}"
      >


      <button
        class="btn"
        id="applyBrand"
      >
        Apply Brand Changes
      </button>

    </div>

  `;


  $("applyHero").onclick=()=>{

    p.name =
      $("editPageName")
        .value
        .trim() ||
      p.name;


    p.hero.title =
      $("editHeroTitle")
        .value;


    p.hero.description =
      $("editHeroDesc")
        .value;


    p.hero.image =
      $("editHeroImage")
        .value;


    renderAll();

  };


  $("heroFile").onchange =
    e => {

      const f =
        e.target.files?.[0];


      if(!f)
        return;


      const reader =
        new FileReader();


      reader.onload=()=>{

        p.hero.image =
          reader.result;

        renderAll();

      };


      reader.readAsDataURL(f);

    };


  if(
    $("applyProducts")
  ){

    $("applyProducts").onclick=()=>{

      const items =
        productItems(p);


      document
        .querySelectorAll(
          "[data-p][data-k]"
        )
        .forEach(
          el => {

            items[
              Number(
                el.dataset.p
              )
            ][
              el.dataset.k
            ] =
              el.value;

          }
        );


      renderAll();

    };

  }


  document
    .querySelectorAll(
      "[data-file]"
    )
    .forEach(
      input => {

        input.onchange =
          e => {

            const f =
              e.target
                .files?.[0];


            if(!f)
              return;


            const reader =
              new FileReader();


            reader.onload=()=>{

              productItems(p)[
                Number(
                  input.dataset.file
                )
              ].image =
                reader.result;


              renderAll();

            };


            reader.readAsDataURL(f);

          };

      }
    );


  $("applyBrand").onclick=()=>{

    state.project.brand.name =
      $("brandName").value ||
      state.project.brand.name;


    state.project.brand.primary =
      $("brandColor").value;


    renderAll();

  };

}


/* =====================================================
   RENDER EVERYTHING
===================================================== */

function renderAll(){

  renderPagesUI();

  renderInspector();


  if(state.project){

    $("preview").srcdoc =
      renderSite(
        state.project
      );


    $("pagePill").textContent =
      selected()?.name ||
      "Home";


    $("scorePill").textContent =
      "Quality " +
      quality() +
      "/100";

  }

}


/* =====================================================
   QUALITY SCORE
===================================================== */

function quality(){

  if(!state.project)
    return 0;


  let s=0;


  if(
    state.project.pages.length === 3
  )
    s += 20;


  if(
    state.project.pages.every(
      p =>
        p.hero?.title
    )
  )
    s += 15;


  if(
    state.project.pages.every(
      p =>
        p.sections?.length >= 2
    )
  )
    s += 20;


  if(
    productItems(
      state.project.pages
        .find(
          p =>
            p.id ===
            "products"
        ) || {}
    ).length >= 6
  )
    s += 15;


  if(
    state.project.brand.name
  )
    s += 10;


  if(
    state.project.seo?.title
  )
    s += 10;


  if(
    state.project.footer?.email
  )
    s += 5;


  if(
    state.project.pages.every(
      p =>
        p.hero?.image
    )
  )
    s += 5;


  return Math.min(
    100,
    s
  );

}


/* =====================================================
   GENERATE
===================================================== */

async function generate(){

  try{

    $("generateBtn")
      .disabled=true;


    status(
      "AI is planning your 3-page website..."
    );


    const bp =
      ensureBlueprint(
        parseJSON(
          await gemini(
            blueprintPrompt()
          )
        )
      );


    state.project =
      bp;


    state.selectedPage =
      "home";


    status(
      "Building pages, product catalog and editor..."
    );


    renderAll();


    status(
      "Website ready. Edit the name, images, products and colors from the right panel."
    );


  }

  catch(e){

    console.error(e);

    status(
      "Error: " +
      e.message
    );

  }

  finally{

    $("generateBtn")
      .disabled=false;

  }

}


/* =====================================================
   AI IMPROVE
===================================================== */

async function improve(){

  if(!state.project){

    status(
      "Generate a website first."
    );

    return;

  }


  try{

    $("improveBtn")
      .disabled=true;


    status(
      "AI is improving the current project..."
    );


    const request = `

Improve this existing ForgeAI website blueprint.


CURRENT:

${JSON.stringify(
  state.project,
  null,
  2
)}


USER REQUEST:

Make the design more premium,
improve copy,
improve section structure,
and improve product presentation,

but preserve the 3 pages
and all useful editable content.


Return the COMPLETE updated JSON only
using the same schema.

`;


    state.project =
      ensureBlueprint(
        parseJSON(
          await gemini(
            request
          )
        )
      );


    renderAll();


    status(
      "AI improvement completed."
    );

  }

  catch(e){

    status(
      "Improve error: " +
      e.message
    );

  }

  finally{

    $("improveBtn")
      .disabled=false;

  }

}


/* =====================================================
   DOWNLOAD
===================================================== */

function download(){

  if(!state.project){

    status(
      "Generate a website first."
    );

    return;

  }


  const blob =
    new Blob(
      [
        renderSite(
          state.project
        )
      ],
      {
        type:
          "text/html"
      }
    );


  const a =
    document.createElement(
      "a"
    );


  a.href =
    URL.createObjectURL(
      blob
    );


  a.download =
    (
      state.project.brand.name ||
      "forgeai-site"
    )
      .replace(
        /[^a-z0-9]+/gi,
        "-"
      )
      .toLowerCase() +
    ".html";


  a.click();


  setTimeout(
    () =>
      URL.revokeObjectURL(
        a.href
      ),
    500
  );

}


/* =====================================================
   SAVE
===================================================== */

function save(){

  if(!state.project){

    status(
      "Nothing to save."
    );

    return;

  }


  localStorage.setItem(
    "forgeai-studio-project",
    JSON.stringify(
      state.project
    )
  );


  status(
    "Project saved on this device."
  );

}


/* =====================================================
   LOAD
===================================================== */

function load(){

  try{

    const raw =
      localStorage.getItem(
        "forgeai-studio-project"
      );


    if(raw){

      state.project =
        ensureBlueprint(
          JSON.parse(raw)
        );


      renderAll();


      status(
        "Saved project loaded."
      );

    }

  }

  catch(e){

    console.warn(e);

  }

}


/* =====================================================
   PRODUCT MESSAGE
===================================================== */

window.addEventListener(
  "message",
  e => {

    if(
      e.data?.type ===
      "product"
    ){

      state.selectedPage =
        "products";


      state.selectedProduct =
        e.data.index || 0;


      renderAll();

    }

  }
);


/* =====================================================
   EVENTS
===================================================== */

$("generateBtn").onclick =
  generate;


$("improveBtn").onclick =
  improve;


$("downloadBtn").onclick =
  download;


$("saveBtn").onclick =
  save;


$("refreshBtn").onclick =
  () =>
    state.project &&
    (
      $("preview").srcdoc =
        renderSite(
          state.project
        )
    );


$("desktopBtn").onclick =
  () => {

    $("preview")
      .style.maxWidth =
      "none";


    $("preview")
      .style.margin =
      "0";

  };


$("mobileBtn").onclick =
  () => {

    $("preview")
      .style.maxWidth =
      "390px";


    $("preview")
      .style.margin =
      "auto";

  };


load();

</script>
